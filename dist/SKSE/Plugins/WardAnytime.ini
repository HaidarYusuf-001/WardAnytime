[Keybind]
MainKey = 0x10
ModifierKey = 0x2A
RequireModifier = false

[MysticismWards]
; Only used if you have Mysticism - A Magic Overhaul installed.
PluginFile = MysticismMagic.esp
GrandWardFormID = 0x00FFF7
SpelldrinkerFormID = 0x3DB99C

[AutoCast]
; If true, Ward is automatically raised whenever the game considers you to be
; blocking - shield, 2H, 1H, unarmed, or any block/parry mod that reports
; blocking state normally (e.g. Dual Wield Parrying SKSE). No extra keybind
; needed on top of your normal block key.
OnBlock = false