[Keybind]
MainKey = 0x10
ModifierKey = 0x2A
RequireModifier = false

; false = hold-to-ward (default). true = press once to enable, press again to disable.
ToggleMode = false

; GAMEPAD SUPPORT IS WIP, IT DOESN'T WORK FOR NOW
[Keybind.Gamepad]
Enable = false
MainButton = 0x112      ; Left Shoulder (LB)
ModifierButton = 0x113  ; Right Shoulder (RB)

; Reference table (Skyrim engine gamepad button codes):
; 0x10A (266) D-Pad Up      0x110 (272) Left Thumbstick Click
; 0x10B (267) D-Pad Down    0x111 (273) Right Thumbstick Click
; 0x10C (268) D-Pad Left    0x112 (274) Left Shoulder (LB)
; 0x10D (269) D-Pad Right   0x113 (275) Right Shoulder (RB)
; 0x10E (270) Start         0x114 (276) A
; 0x10F (271) Back          0x115 (277) B
;                           0x116 (278) X
;                           0x117 (279) Y
;                           0x118 (280) Left Trigger (LT)
;                           0x119 (281) Right Trigger (RT)

[Restrictions]
; Leave ALL of these false for no restriction (Ward works in every stance, default).
; Turn one or more ON to restrict Ward to only those stances (OR'd together —
; e.g. Magic=true + Melee=true means magic AND melee both work, ranged/unarmed/shielded/sheathed don't).
;
RequireMagicEquipped = false
RequireMeleeEquipped = false
RequireRangedEquipped = false
RequireUnarmed = false
RequireShielded = false
RequireSheathed = false

[MysticismWards]
; Only used if you have Mysticism - A Magic Overhaul installed.
; If the plugin filename below doesn't match your install, edit it here —
; check your load order (e.g. in MO2/Vortex) for the exact .esp name.
PluginFile = MysticismMagic.esp
GrandWardFormID = 0x00FFF7
SpelldrinkerFormID = 0x3DB99C

[AutoCast]
OnBlock = false